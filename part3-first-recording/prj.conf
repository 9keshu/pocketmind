# GPIO for LEDs and mic power
CONFIG_GPIO=y
CONFIG_REGULATOR=y

# PDM microphone
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# SD card over SPI
CONFIG_SPI=y
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

# File system: FAT + exFAT (card is formatted exFAT)
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_EXFAT=y

CONFIG_MAIN_STACK_SIZE=4096
